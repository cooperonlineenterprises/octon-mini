name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  blueprint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate blueprint source and profile builds
        run: python -B skills/project-bootstrap/scripts/validate_blueprint.py
      - name: Run end-to-end and adversarial acceptance
        run: python -B skills/project-bootstrap/scripts/test_acceptance.py
