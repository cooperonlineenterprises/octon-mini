name: validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pull-request-gate:
    name: required
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Validate skill package metadata
        run: python -B skills/octon-mini-project-bootstrap/scripts/validate_skill_package.py
      - name: Validate reference-evidence registry and citations
        run: python -B skills/octon-mini-project-bootstrap/scripts/verify_reference_evidence.py
      - name: Validate Octon Mini source and profile builds
        run: python -B skills/octon-mini-project-bootstrap/scripts/validate_octon_mini.py
      - name: Run end-to-end and adversarial acceptance
        run: python -B skills/octon-mini-project-bootstrap/scripts/test_acceptance.py

  main-smoke:
    name: main-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Validate skill package metadata
        run: python -B skills/octon-mini-project-bootstrap/scripts/validate_skill_package.py
      - name: Validate reference-evidence registry and citations
        run: python -B skills/octon-mini-project-bootstrap/scripts/verify_reference_evidence.py
      - name: Validate Octon Mini source and profile builds
        run: python -B skills/octon-mini-project-bootstrap/scripts/validate_octon_mini.py

  full-matrix:
    name: full / ${{ matrix.os }} / Python ${{ matrix.python }}
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate skill package metadata
        run: python -B skills/octon-mini-project-bootstrap/scripts/validate_skill_package.py
      - name: Validate reference-evidence registry and citations
        run: python -B skills/octon-mini-project-bootstrap/scripts/verify_reference_evidence.py
      - name: Validate Octon Mini source and profile builds
        run: python -B skills/octon-mini-project-bootstrap/scripts/validate_octon_mini.py
      - name: Run end-to-end and adversarial acceptance
        run: python -B skills/octon-mini-project-bootstrap/scripts/test_acceptance.py
